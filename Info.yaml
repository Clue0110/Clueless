    - company: "Samsung Research and Development"
      position: "Research Intern"
      start_date: "2021=05-01"
      end_date: "2021-11-30"
      location: "Bangalore, India"
      experience:
        - "Working to enhance Samsung's native camera in a competitive market, my team addressed the user demand for capturing expansive scenes beyond a standard video frame, as existing methods like panning or third-party apps produced poor results. I was tasked with leading the development of a real-time panoramic video stitching module for flagship smartphones, which aimed to seamlessly integrate feeds from multiple cameras. The key objectives were to deliver a smooth, low-latency, high-fidelity panoramic video experience by correcting for distortions and exposure differences, all while being optimized for the power and thermal constraints of a mobile device. Built this mainly using Python and OpenCV"
        - "In a project aimed at creating a more immersive visual experience for our product, I was tasked with overcoming the limited field of view of a standard camera by combining feeds from a synchronized dual-camera system. My objective was to design and implement a video stitching module capable of generating a seamless panoramic view in real-time, with a strict performance requirement of under 100 milliseconds per frame to ensure fluid video output. To achieve this, I engineered a solution that began by applying the SIFT (Scale-Invariant Feature Transform) algorithm to robustly detect and match corresponding feature points between the two video streams, ensuring reliability despite changes in scale or rotation. From these matched points, I calculated the homography matrix using RANSAC to define the precise geometric perspective warp needed for accurate alignment. The key challenge was the computational cost of SIFT, which I overcame by focusing detection on the overlapping image regions and parallelizing the processing pipeline using multi-threading. As a result, the fully implemented module successfully stitched the dual feeds into a high-quality panoramic video, consistently meeting the sub-100ms real-time processing target and becoming a critical component that enabled a key wide-angle viewing feature in our final product."
        - "In our panoramic video stitching project, early prototypes suffered from a distracting vertical seam where the videos were joined, caused by slight variations in color and exposure between the camera sensors. My task was to perfect the visual quality by creating a completely seamless blend and preserving the original resolution of the source videos. To solve this, I implemented a two-pronged strategy: first, I used histogram matching on the overlapping regions of the video frames to dynamically normalize the brightness and color balance in real-time. Second, I integrated a multi-band blending algorithm, which operates on different image frequency bands to create an imperceptible transition, effectively erasing the seam. To maintain sharpness, I ensured our geometric warping process used bicubic interpolation for resampling, preventing any degradation of the original video detail. As a result, the final panoramic output had a uniform color grade and maintained over 99% of the source resolution, leading to a 30% reduction in user-reported visual artifacts and delivering the high-quality, professional-grade output required for the feature's successful launch."
        - "During the development of our real-time video stitching algorithm, the engineering and QA teams needed an effective way to visualize and debug the process as it happened. Relying on saved files to diagnose issues like misalignments or color shifts was inefficient and made it difficult to connect problems in the final output with the live camera inputs. To solve this, I was tasked with creating an internal diagnostic tool that would provide immediate visual feedback. I developed a user-friendly Graphical User Interface using Python's Tkinter library to simultaneously display the live feeds from the individual cameras alongside the final, stitched panoramic view. To ensure the application remained responsive, I implemented a multi-threaded design that separated the intensive video processing from the GUI event loop. This tool became an essential asset for our workflow, enabling developers and testers to instantly see the relationship between the source videos and the stitched output, which significantly streamlined the process of identifying and resolving bugs and was instrumental in validating the quality of the final algorithm."

    - company: "Samsung Research and Development"
