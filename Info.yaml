      experience:
        - "Investigated the use of smartphone sensor data for human gait pattern analysis to enable gait authentication and personalized coaching"
        - "In my role, we were exploring novel biometric security and personalized health technologies that could be deployed on everyday devices. We identified human gait-an individual's unique walking pattern-as a promising candidate for both continuous authentication and for providing personalized coaching. My specific task was to determine if we could reliably capture and analyze these subtle gait patterns using only the sensors already present in a smartphone. To achieve this, I led the data acquisition phase of the project, where I used Samsung mobile phones to collect motion data from a diverse cohort of users, ensuring we had a representative sample across various ages and heights. I specifically captured high-fidelity motion data by setting the accelerometer and gyroscope to a 100Hz sampling rate. The result was the successful creation of a robust and comprehensive dataset of human gait patterns. This foundational work was critical, as it directly enabled the subsequent research and development of our gait authentication and personalized coaching algorithms, proving that smartphone sensors were a viable tool for this type of analysis."
        - "After collecting the raw sensor data for our gait analysis project, we were faced with the challenge of processing that continuous, noisy stream of information to find distinct patterns for each user. My primary task was to develop a computational method to analyze this data and isolate key, repeatable events that would represent an individual's unique walking style. To achieve this, I developed and implemented a custom peak detection algorithm in Python. This algorithm was specifically designed to parse the time-series data from the phone's accelerometer and accurately identify the distinct peaks that corresponded to the impact of each footstep. The successful implementation of this algorithm was a critical breakthrough for the project. It allowed us to process the raw data effectively and, more importantly, led to the identification of a significant correlation between the features of these accelerometer peaks and an individual's unique gait. This result validated our core hypothesis and provided the foundational proof needed to proceed with developing the full gait authentication and personalized coaching systems."
        - "After we successfully processed the raw sensor data to identify individual footsteps, the next logical step in our project was to define what a 'normal' or baseline walking pattern looked like for each person. My specific task was to create a unique gait signature for every participant, which would serve as the core reference point for both the authentication and coaching features. To accomplish this, I analyzed the processed accelerometer trends for each individual, aggregating the characteristics of their steps to compute a stable and distinct baseline. I essentially distilled the complex motion data into a representative profile for each user. The direct result of this work was the creation of a foundational dataset of unique gait baselines. This was a critical milestone, as this dataset provided the essential ground truth we needed to train our machine learning models, directly enabling the development of the personalized gait authentication and coaching applications that were the project's main objective."
    
